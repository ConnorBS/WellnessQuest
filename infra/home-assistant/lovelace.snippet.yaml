type: vertical-stack
title: WellnessQuest
cards:
  - type: gauge
    entity: sensor.wq_water_today
    name: Water today
    min: 0
    max: 2000
    severity:
      green: 1500
      yellow: 750
      red: 0

  - type: horizontal-stack
    cards:
      - type: button
        name: "+250 ml"
        icon: mdi:cup-water
        tap_action:
          action: call-service
          service: rest_command.wq_add_water
          service_data: { ml: 250 }
      - type: button
        name: "+500 ml"
        icon: mdi:cup-water
        tap_action:
          action: call-service
          service: rest_command.wq_add_water
          service_data: { ml: 500 }
      - type: button
        name: "+750 ml"
        icon: mdi:cup-water
        tap_action:
          action: call-service
          service: rest_command.wq_add_water
          service_data: { ml: 750 }

  - type: entity
    entity: sensor.wq_level
    name: Level
