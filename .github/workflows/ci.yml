name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wq
          POSTGRES_PASSWORD: wq
          POSTGRES_DB: wellnessquest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U wq -d wellnessquest_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://wq:wq@localhost:5432/wellnessquest_test
      JWT_SECRET: ci-jwt-secret
      FERNET_KEY: ci-fernet-key
      ADMIN_PASSWORD: CiAdminPass123!
      PARTNER_PASSWORD: CiPartnerPass123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install --upgrade pip && pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy app
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  build-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -t wq-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t wq-frontend:ci ./frontend
