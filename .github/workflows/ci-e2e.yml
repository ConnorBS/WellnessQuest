name: e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for compose
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci-postgres" >> .env
          echo "JWT_SECRET=ci-jwt-secret" >> .env
          echo "FERNET_KEY=ci-fernet-key" >> .env
          echo "ADMIN_PASSWORD=CiAdminPass123!" >> .env
          echo "PARTNER_PASSWORD=CiPartnerPass123!" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://wq:ci-postgres@postgres:5432/wellnessquest" >> .env

      - name: Bring up stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build postgres backend frontend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Seed
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T backend python -m app.db.seed

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_BASE: http://localhost:8000/api/v1
          ADMIN_EMAIL: admin@local
          ADMIN_PASSWORD: CiAdminPass123!
        run: pnpm exec playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Post failure log as PR comment
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/post-ci-failure.js`)({ github, context, core, jobName: 'playwright' });
