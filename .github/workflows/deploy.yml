name: deploy

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (optional)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: t
        run: |
          set -euo pipefail
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER}/wellnessquest"
          SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-7)
          TAGS="${IMG}:sha-${SHA_SHORT}"
          case "${{ github.ref }}" in
            refs/heads/main)
              TAGS="${TAGS},${IMG}:latest,${IMG}:stable"
              ;;
            refs/heads/claude/*)
              TAGS="${TAGS},${IMG}:preview"
              ;;
          esac
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS},${IMG}:${{ inputs.tag }}"
          fi
          {
            echo "tags=${TAGS}"
            echo "image=${IMG}"
            echo "sha_short=${SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: true
          tags: ${{ steps.t.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=wellnessquest
          cache-to: type=gha,mode=max,scope=wellnessquest

      - name: Summary
        run: |
          echo "### Published wellnessquest" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.t.outputs.tags }}' | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  migrations-sql:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wq
          POSTGRES_PASSWORD: wq
          POSTGRES_DB: wellnessquest_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U wq -d wellnessquest_migrate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://wq:wq@localhost:5432/wellnessquest_migrate
      JWT_SECRET: ci-jwt
      FERNET_KEY: ci-fernet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install --upgrade pip && pip install .
      - name: Render upgrade SQL
        run: alembic upgrade head --sql > /tmp/upgrade.sql
      - uses: actions/upload-artifact@v4
        with:
          name: alembic-upgrade-sql
          path: /tmp/upgrade.sql
          retention-days: 30
