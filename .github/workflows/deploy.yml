name: deploy

on:
  push:
    branches: [main, "claude/**"]
    # Semver release tags (vX.Y.Z) publish the immutable :vX.Y.Z plus the
    # :stable / :latest / :X.Y / :X aliases that self-hosters can pin.
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (optional)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: t
        run: |
          set -euo pipefail
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER}/wellnessquest"
          SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-7)
          TAGS="${IMG}:sha-${SHA_SHORT}"
          case "${{ github.ref }}" in
            refs/tags/v*.*.*)
              # Tagged release: vX.Y.Z[-prerelease]. Publish the immutable
              # exact tag, the X.Y / X / bare-semver aliases, and (for non-
              # prerelease tags only) the floating :stable / :latest channels.
              V="${{ github.ref_name }}"
              BARE="${V#v}"
              IFS=. read -r MAJOR MINOR REST <<< "$BARE"
              PATCH="${REST%%-*}"
              PRERELEASE=""
              if [ "$REST" != "$PATCH" ]; then
                PRERELEASE="${REST#*-}"
              fi
              TAGS="${TAGS},${IMG}:${V},${IMG}:${BARE}"
              if [ -z "$PRERELEASE" ]; then
                TAGS="${TAGS},${IMG}:${MAJOR}.${MINOR},${IMG}:${MAJOR},${IMG}:stable,${IMG}:latest"
              fi
              ;;
            refs/heads/main)
              # main HEAD between releases gets only the immutable :sha-<7>
              # here. The floating :edge tag is published by build-edge.yml,
              # which integrates main + every open claude/* branch.
              ;;
            refs/heads/claude/*)
              # Feature branches share one rolling :preview tag for dev/testing.
              TAGS="${TAGS},${IMG}:preview"
              ;;
          esac
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS="${TAGS},${IMG}:${{ inputs.tag }}"
          fi
          {
            echo "tags=${TAGS}"
            echo "image=${IMG}"
            echo "sha_short=${SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: true
          tags: ${{ steps.t.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=wellnessquest
          cache-to: type=gha,mode=max,scope=wellnessquest

      - name: Summary
        run: |
          echo "### Published wellnessquest" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.t.outputs.tags }}' | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  notify-on-failure:
    needs: [publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open a tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const messageHead = (context.payload.head_commit && context.payload.head_commit.message || "").split('\n')[0];
            const body = [
              `Deploy workflow failed for commit \`${sha}\` on branch \`${branch}\`.`,
              '',
              messageHead ? `> ${messageHead}` : '',
              '',
              `[View workflow run logs →](${runUrl})`,
              '',
              `Commit: ${commitUrl}`,
              '',
              '**Impact:** the published image on GHCR is still whatever the previous successful build produced. Force Update on Unraid will pull stale code until this is fixed.',
              '',
              'Common causes:',
              '- Next.js prod-only lint error (e.g. `react/no-unescaped-entities`) — `pnpm typecheck` does NOT catch these; run `NEXT_OUTPUT_MODE=export pnpm build` locally.',
              '- Alembic migration syntax error.',
              '- Type error in newly-added code (Python or TypeScript).',
            ].filter(line => line !== null).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed: ${sha} on ${branch}`,
              body,
            });

  migrations-sql:
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wq
          POSTGRES_PASSWORD: wq
          POSTGRES_DB: wellnessquest_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U wq -d wellnessquest_migrate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://wq:wq@localhost:5432/wellnessquest_migrate
      JWT_SECRET: ci-jwt
      # Valid Fernet key (32 url-safe base64 bytes). Alembic doesn't read it, but
      # loading app modules under the lifespan would, so keep this real.
      FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install --upgrade pip && pip install .
      - name: Render upgrade SQL
        run: alembic upgrade head --sql > /tmp/upgrade.sql
      - uses: actions/upload-artifact@v4
        with:
          name: alembic-upgrade-sql
          path: /tmp/upgrade.sql
          retention-days: 30
