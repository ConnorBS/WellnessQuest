name: Bug
description: Something broken
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Environment
      description: device, browser, app version (commit), HA version if relevant
