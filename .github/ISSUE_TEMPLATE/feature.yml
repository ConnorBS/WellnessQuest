name: Feature
description: A new feature or enhancement
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve?
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list. Each item must be verifiable.
      placeholder: |
        - [ ] ...
    validations: { required: true }
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this issue does NOT cover.
  - type: textarea
    id: notes
    attributes:
      label: Notes / design pointers
