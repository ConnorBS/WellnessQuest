services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wellnessquest}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wq} -d ${POSTGRES_DB:-wellnessquest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  backend:
    image: ghcr.io/${WQ_IMAGE_OWNER:-connorbs}/wellnessquest-backend:${WQ_IMAGE_TAG:-preview}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  frontend:
    image: ghcr.io/${WQ_IMAGE_OWNER:-connorbs}/wellnessquest-frontend:${WQ_IMAGE_TAG:-preview}
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Caddy is opt-in. Bring it up with:  docker compose --profile proxy up -d
  # Useful if you want LAN HTTPS via Caddy's internal CA. Default first run skips it
  # and exposes backend/frontend directly on the BACKEND_PORT / FRONTEND_PORT.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  backup:
    build:
      context: ./infra/backup
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wellnessquest}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  pg_data: {}
  caddy_data: {}
  caddy_config: {}
