services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wellnessquest}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wq} -d ${POSTGRES_DB:-wellnessquest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  app:
    image: ghcr.io/${WQ_IMAGE_OWNER:-connorbs}/wellnessquest:${WQ_IMAGE_TAG:-preview}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_PORT: ${APP_PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # APP_PORT now sets the app's internal bind port too (see Dockerfile),
      # so both sides of the mapping must use the same value or the bridge
      # mapping forwards to a port no one is listening on.
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Caddy is opt-in. Bring it up with:  docker compose --profile proxy up -d
  # Useful if you want LAN HTTPS via Caddy's internal CA. Default first run skips it
  # and exposes the app directly on APP_PORT.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  backup:
    build:
      context: ./infra/backup
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wellnessquest}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  pg_data: {}
  caddy_data: {}
  caddy_config: {}
