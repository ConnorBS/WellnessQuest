services:
  backend:
    image: wq-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    pull_policy: never
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini

  frontend:
    image: wq-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    pull_policy: never
    command: ["pnpm", "dev", "--port", "3000", "--hostname", "0.0.0.0"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/tsconfig.json:/app/tsconfig.json

  postgres:
    ports:
      - "5432:5432"
