services:
  postgres:
    # Clear the pg_data volume mount inherited from docker-compose.yml so the
    # tmpfs below can mount /var/lib/postgresql/data without compose tripping
    # over two mount targets at the same path. The init.sql mount lives at a
    # different target so we lose nothing by resetting this list.
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    image: wq-backend:ci
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"

  frontend:
    image: wq-frontend:ci
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    pull_policy: never
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_UPSTREAM: http://backend:8000
    ports:
      - "3000:3000"

  backup:
    profiles: ["disabled"]
