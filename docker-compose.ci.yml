services:
  postgres:
    # Clear the pg_data volume mount inherited from docker-compose.yml so the
    # tmpfs below can mount /var/lib/postgresql/data without compose tripping
    # over two mount targets at the same path. The init.sql mount lives at a
    # different target so we lose nothing by resetting this list.
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  # `backend` and `frontend` are CI-only service names — the prod
  # docker-compose.yml runs the unified `app` image instead. We define them
  # standalone here (not as inheritors of `app`) so the e2e workflow can build
  # them from the per-service Dockerfiles. Everything they need to actually
  # boot — db waits, env vars, host port mappings — has to be set here, since
  # nothing is inherited from the base file.
  backend:
    image: wq-backend:ci
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"

  frontend:
    image: wq-frontend:ci
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    pull_policy: never
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_UPSTREAM: http://backend:8000
    ports:
      - "3000:3000"

  backup:
    profiles: ["disabled"]
